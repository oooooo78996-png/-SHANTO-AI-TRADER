name: Build SHANTO AI TRADER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Project ZIP
        run: |
          mkdir -p source
          unzip -oq *.zip -d source
          echo "Project files:"
          find source -name settings.gradle.kts

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Fix Java and Kotlin JVM Target
        run: |
          FILE=$(find source -path '*/app/build.gradle.kts' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "App Gradle file not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys

          p = sys.argv[1]
          s = open(p).read()

          if 'compileOptions {' not in s:
              s = s.replace(
                  '    defaultConfig {',
                  '''    compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
                  defaultConfig {'''
              )

          open(p, 'w').write(s)
          PY

      - name: Build Debug APK
        run: |
          cd source
          gradle assembleDebug

      - name: Verify APK
        run: |
          find source -name "*.apk"
          test -f source/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename and Send APK to Telegram
        run: |
          cp source/app/build/outputs/apk/debug/app-debug.apk SHANTO-AI-TRADER.apk
          curl -F document=@"SHANTO-AI-TRADER.apk" \
               -F caption="✅ SHANTO AI TRADER APK Build Succeeded!" \
               "https://api.telegram.org/bot8314265487:AAENcGSDWNLSy8T-kCesOOonBzOM1yNoKZQ/sendDocument?chat_id=8400624328"
               
